<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>מונדיאל ניחושים ⚽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
</head>
<body>
  <!-- מסך כניסה / הרשמה -->
  <section id="auth" class="auth hidden">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="brand">
        <div class="brand-ball">⚽</div>
        <div>
          <h1>מונדיאל ניחושים</h1>
          <p class="brand-sub">תחרות הניחושים של החברים בעבודה</p>
        </div>
      </div>

      <div class="tabs auth-tabs">
        <button class="tab active" data-auth-tab="join">הצטרפות בקוד</button>
        <button class="tab" data-auth-tab="create">פתיחת תחרות</button>
      </div>

      <form id="join-form" class="auth-form">
        <label>קוד הצטרפות
          <input name="code" placeholder="לדוגמה: K7P2QM" autocomplete="off" maxlength="6"
                 style="text-transform:uppercase; letter-spacing:.3em; font-weight:800" />
        </label>
        <label>השם שלך
          <input name="name" placeholder="איך נקרא לך בטבלה?" autocomplete="off" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">כניסה לתחרות ←</button>
        <p class="hint">קיבלת קוד מהחבר שפתח את התחרות? הזן אותו כאן.</p>
      </form>

      <form id="create-form" class="auth-form hidden">
        <label>שם התחרות
          <input name="name" placeholder="לדוגמה: מונדיאל המשרד 2026" autocomplete="off" />
        </label>
        <label>השם שלך (מנהל/ת)
          <input name="adminName" placeholder="השם שלך" autocomplete="off" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">פתיחת תחרות חדשה ✦</button>
        <p class="hint">תקבל קוד הצטרפות שתוכל לשתף עם החברים.</p>
      </form>
    </div>
    <footer class="auth-foot">בנוי באהבה למונדיאל · ניקוד אוטומטי · תוצאות בלייב</footer>
  </section>

  <!-- האפליקציה -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="topbar-in">
        <div class="comp">
          <span class="comp-ball">⚽</span>
          <div>
            <div class="comp-name" id="comp-name">—</div>
            <button class="comp-code" id="comp-code" title="העתק קוד הצטרפות">קוד: ——</button>
          </div>
        </div>
        <div class="topbar-right">
          <div class="who">
            <span class="who-name" id="who-name">—</span>
            <span class="who-meta" id="who-meta"></span>
          </div>
          <button class="icon-btn" id="logout" title="יציאה">⎋</button>
        </div>
      </div>
      <nav class="tabs main-tabs">
        <button class="tab active" data-tab="matches">המשחקים</button>
        <button class="tab" data-tab="board">טבלת דירוג</button>
        <button class="tab admin-only hidden" data-tab="admin">ניהול</button>
      </nav>
    </header>

    <main class="content">
      <div id="view-matches" class="view"></div>
      <div id="view-board" class="view hidden"></div>
      <div id="view-admin" class="view hidden"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-root"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
